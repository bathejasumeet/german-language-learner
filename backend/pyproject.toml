[project]
name = "german-language-learner"
version = "0.1.0"
description = "A German language learning application with flashcards and quizzes"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.11",
    "alembic==1.18.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "black==26.3.1",
    "isort==8.0.1",
    "flake8==7.3.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
